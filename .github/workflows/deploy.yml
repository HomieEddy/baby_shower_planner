name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy backend
        run: railway up --ci --service baby_shower_planner --environment production --project 5cc75b7b-9ced-4d44-bcf1-4fb3b83d2279
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
